<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>جهیزیه — لیست خرید</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#5C0811">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
<style>
:root{--shiri:#FFF8F0;--pastel:#FFDCE5;--rose:#E79FB2;--gilasi:#A4133C;--zershki:#5C0811;--text:#3D1A23;--muted:#9A6B76;--border:#F3C9D4;--ok:#1B7A6E;--warn:#B7791F}
*{box-sizing:border-box}body{margin:0;background:var(--shiri);color:var(--text);font-family:Vazirmatn,system-ui,sans-serif}
header{background:var(--zershki);color:#fff;padding:14px 14px 12px;border-radius:0 0 20px 20px;position:sticky;top:0;z-index:5}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:8px}
h1{font-size:17px;margin:0}
.hbtn{background:rgba(255,255,255,.16);border:0;color:#fff;border-radius:10px;padding:7px 11px;font-family:inherit;font-size:13px}
.fstrip{color:var(--pastel);font-size:12px;margin-top:6px}
.search{width:100%;margin-top:10px;border:0;border-radius:12px;padding:10px 12px;font-family:inherit}
main{padding:14px 14px 96px;max-width:640px;margin:0 auto}
.card{background:#fff;border:1px solid var(--border);border-radius:16px;padding:13px;margin-bottom:10px;display:flex;gap:10px;align-items:center;cursor:pointer}
.dot{width:12px;height:12px;border-radius:6px;background:var(--gilasi);flex-shrink:0}
.tt{font-weight:700;font-size:15px}.ss{color:var(--muted);font-size:12px;margin-top:2px}
.icobtn{border:0;background:#f6f6f6;border-radius:9px;padding:6px 9px;font-size:15px}
.badge{display:inline-block;border-radius:8px;padding:2px 9px;font-size:11px;margin:3px 0 3px 5px}
.thumb{width:56px;height:56px;border-radius:12px;object-fit:cover;background:var(--pastel);flex-shrink:0}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}
.chip{border:1px solid var(--border);background:#fff;border-radius:20px;padding:6px 13px;font-family:inherit;font-size:12px}
.chip.on{background:var(--gilasi);border-color:var(--gilasi);color:#fff}
.fab{position:fixed;bottom:22px;left:22px;width:58px;height:58px;border-radius:29px;background:var(--gilasi);color:#fff;border:0;font-size:30px;box-shadow:0 4px 14px rgba(164,19,60,.4)}
.sheet{position:fixed;inset:0;background:rgba(60,10,20,.45);display:none;align-items:flex-end;z-index:20}
.sheet.open{display:flex}
.panel{background:#fff;border-radius:22px 22px 0 0;padding:18px;width:100%;max-width:640px;margin:0 auto;max-height:92vh;overflow:auto}
.lbl{font-size:13px;font-weight:700;margin:11px 0 4px}
.inp{width:100%;background:var(--shiri);border:1px solid var(--border);border-radius:12px;padding:10px 12px;font-family:inherit}
textarea.inp{min-height:64px}
.row2{display:flex;gap:8px}.row2>div{flex:1}
.btnrow{display:flex;gap:8px;margin-top:16px}
.btn{flex:1;border:0;border-radius:12px;padding:12px;font-family:inherit;font-weight:700;font-size:14px}
.main{background:var(--gilasi);color:#fff}.ghost{background:var(--pastel);color:var(--zershki)}
.sum{background:#fff;border:1px solid var(--border);border-radius:16px;padding:14px;margin-bottom:12px}
.srow{display:flex;justify-content:space-between;padding:4px 0}
.bar{height:10px;background:#F1E2E6;border-radius:5px;margin:8px 0;overflow:hidden}
.bar>i{display:block;height:10px;background:var(--gilasi)}
img.big{width:100%;border-radius:14px;margin:8px 0}
.empty{text-align:center;color:var(--muted);padding:34px 10px}
.hint{background:#fff;border:1px dashed var(--rose);border-radius:14px;padding:11px;font-size:12px;color:var(--muted);margin-bottom:12px}
</style>
</head>
<body>
<header>
  <div class="hrow">
    <button class="hbtn" id="backBtn" style="visibility:hidden">برگشت ›</button>
    <h1 id="title">لیست خرید جهیزیه</h1>
    <div><button class="hbtn" id="finBtn">💰 مالی</button> <button class="hbtn" id="backupBtn">📤</button></div>
  </div>
  <div class="fstrip" id="fstrip"></div>
  <input class="search" id="search" placeholder="جست‌وجوی دسته...">
</header>
<main id="main"></main>
<button class="fab" id="fab">+</button>
<div class="sheet" id="sheet"><div class="panel" id="panel"></div></div>

<script>
const KEY="jahizyie-v1";
const P={essential:["ضروری","#A4133C","#FBDCE5"],normal:["عادی","#9A5B3C","#FFEEDD"],unimportant:["مهم نیست","#8A8A8A","#F1F1F1"]};
const S={not_bought:["خرید نشده","#8A8A8A","#F1F1F1"],buying:["در حال خرید","#B7791F","#FFF3D6"],bought:["خرید شده","#1B7A6E","#D9F2EE"]};
const M={cash:"نقد",check:"چکی",snapppay:"اسنپ‌پی",digipay:"دیجی‌پی"};
let db={categories:[],subs:[],items:[]};
try{db=JSON.parse(localStorage.getItem(KEY))||db;}catch(e){}
if(!db.categories)db={categories:[],subs:[],items:[]};
const save=()=>localStorage.setItem(KEY,JSON.stringify(db));
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36);
const fa=n=>Number(n||0).toLocaleString("fa-IR");
const parseP=s=>{if(typeof s==="number")return s;if(!s)return 0;const e=String(s).replace(/[۰-۹]/g,d=>"۰۱۲۳۴۵۶۷۸۹".indexOf(d)).replace(/[^0-9]/g,"");return e?parseInt(e,10):0;};
let nav={screen:"home"},filter="all";
const $=id=>document.getElementById(id);
const main=$("main"),sheet=$("sheet"),panel=$("panel");

function finance(){
  let total=0,paid=0;const by={cash:0,check:0,snapppay:0,digipay:0};
  for(const it of db.items){const t=+it.price||0;total+=t;let p=+(it.paidAmount??(it.status==="bought"?t:0));if(p>t)p=t;paid+=p;if(by[it.payMethod]!==undefined)by[it.payMethod]+=t;}
  return{total,paid,remain:total-paid,by};
}
function refreshStrip(){const f=finance();$("fstrip").textContent=`پرداخت‌شده: ${fa(f.paid)} تومان • مانده/قسط: ${fa(f.remain)} تومان`;}
function badge(txt,fg,bg){return `<span class="badge" style="color:${fg};background:${bg}">${txt}</span>`;}

function render(){
  refreshStrip();
  const back=$("backBtn"),search=$("search");
  back.style.visibility=nav.screen==="home"?"hidden":"visible";
  search.style.display=nav.screen==="home"?"block":"none";
  if(nav.screen==="home")return viewHome();
  if(nav.screen==="subs")return viewSubs();
  if(nav.screen==="items")return viewItems();
  if(nav.screen==="finance")return viewFinance();
}
function viewHome(){
  const q=$("search").value.trim();
  $("title").textContent="لیست خرید جهیزیه";
  const cats=db.categories.filter(c=>!q||c.name.includes(q));
  main.innerHTML=(cats.length?"":`<div class="empty">هنوز دسته‌ای نداری.<br>با دکمه + بساز: مثلاً «آشپزخانه».</div>`)+cats.map(c=>{
    const n=db.subs.filter(s=>s.categoryId===c.id).length;
    return `<div class="card" data-cat="${c.id}"><div class="dot"></div><div style="flex:1"><div class="tt">${esc(c.name)}</div><div class="ss">${fa(n)} زیرمنو</div></div><button class="icobtn" data-edit-cat="${c.id}">✏️</button><button class="icobtn" data-del-cat="${c.id}">🗑️</button><span style="color:#999">‹</span></div>`;
  }).join("");
  $("fab").onclick=()=>catSheet(null);
}
function viewSubs(){
  const c=db.categories.find(x=>x.id===nav.categoryId);
  $("title").textContent=c?c.name:"زیرمنوها";
  const subs=db.subs.filter(s=>s.categoryId===nav.categoryId);
  main.innerHTML=(subs.length?"":`<div class="empty">زیرمنویی نیست.<br>مثلاً «ظروف پخت» بساز.</div>`)+subs.map(s=>{
    const items=db.items.filter(i=>i.subId===s.id),b=items.filter(i=>i.status==="bought").length;
    return `<div class="card" data-sub="${s.id}"><div class="dot" style="background:var(--rose)"></div><div style="flex:1"><div class="tt">${esc(s.name)}</div><div class="ss">${fa(b)} از ${fa(items.length)} خرید شده</div></div><button class="icobtn" data-edit-sub="${s.id}">✏️</button><button class="icobtn" data-del-sub="${s.id}">🗑️</button><span style="color:#999">‹</span></div>`;
  }).join("");
  $("fab").onclick=()=>subSheet(null);
}
function viewItems(){
  const s=db.subs.find(x=>x.id===nav.subId);
  $("title").textContent=s?s.name:"اقلام";
  let items=db.items.filter(i=>i.subId===nav.subId);
  if(filter!=="all")items=items.filter(i=>i.status===filter);
  const chips=[["all","همه"],["not_bought","خرید نشده"],["buying","در حال خرید"],["bought","خرید شده"]].map(([k,l])=>`<button class="chip${filter===k?" on":""}" data-f="${k}">${l}</button>`).join("");
  main.innerHTML=`<div class="chips">${chips}</div>`+(items.length?"":`<div class="empty">کالایی نیست. با + اضافه کن.</div>`)+items.map(it=>{
    const p=P[it.priority]||P.normal,sg=S[it.status]||S.not_bought;
    return `<div class="card" data-item="${it.id}">${it.photo?`<img class="thumb" src="${it.photo}">`:`<div class="thumb" style="display:flex;align-items:center;justify-content:center">🛒</div>`}<div style="flex:1"><div class="tt">${esc(it.name)}</div><div>${badge(p[0],p[1],p[2])}${badge(sg[0]+" ↻",sg[1],sg[2])}</div><div class="ss">${it.store?"🏪 "+esc(it.store)+" • ":""}${it.price?fa(it.price)+" تومان":"بدون قیمت"}${it.payMethod?" • "+M[it.payMethod]:""}</div></div><div><button class="icobtn" data-edit-item="${it.id}">✏️</button><button class="icobtn" data-del-item="${it.id}">🗑️</button></div></div>`;
  }).join("");
  $("fab").onclick=()=>itemSheet(null);
}
function viewFinance(){
  $("title").textContent="وضعیت مالی";
  const f=finance(),pct=f.total?Math.round(f.paid/f.total*100):0;
  const debts=db.items.filter(i=>(+i.price||0)-(+(i.paidAmount||0))>0);
  main.innerHTML=`<div class="sum"><div class="tt">💰 خلاصه مالی (تومان)</div>
  <div class="srow"><span>جمع کل</span><b>${fa(f.total)}</b></div>
  <div class="srow"><span>پرداخت‌شده</span><b style="color:var(--ok)">${fa(f.paid)}</b></div>
  <div class="srow"><span>مانده / قسط</span><b style="color:var(--gilasi)">${fa(f.remain)}</b></div>
  <div class="bar"><i style="width:${pct}%"></i></div><div class="ss">${fa(pct)}٪ پرداخت شده</div></div>
  <div class="sum"><div class="tt">تفکیک نحوه خرید</div>${Object.entries(M).map(([k,l])=>`<div class="srow"><span>${l}</span><b>${fa(f.by[k]||0)}</b></div>`).join("")}</div>
  <div class="sum"><div class="tt">بدهی‌ها (${fa(debts.length)} قلم)</div>${debts.length?debts.map(d=>`<div class="srow"><span>${esc(d.name)}</span><b>${fa((+d.price||0)-(+(d.paidAmount||0)))}</b></div>`).join(""):'<div class="ss">🎉 بدهی نداری!</div>'}</div>`;
  $("fab").onclick=()=>{nav={screen:"home"};render();};
}
function esc(s){return String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function open(html){panel.innerHTML=html;sheet.classList.add("open");}
function close(){sheet.classList.remove("open");}
sheet.addEventListener("click",e=>{if(e.target===sheet)close();});

function catSheet(id){
  const c=id?db.categories.find(x=>x.id===id):{name:""};
  open(`<div class="tt">${id?"ویرایش دسته":"دسته جدید"}</div><div class="lbl">نام دسته *</div><input class="inp" id="f_name" value="${esc(c.name)}" placeholder="مثلاً آشپزخانه"><div class="btnrow"><button class="btn ghost" onclick="close()">انصراف</button><button class="btn main" id="f_ok">ذخیره</button></div>`);
  window.close=close;
  $("f_ok").onclick=()=>{const n=$("f_name").value.trim();if(!n)return alert("نام دسته را وارد کن.");if(id)db.categories=db.categories.map(x=>x.id===id?{...x,name:n}:x);else db.categories.push({id:uid(),name:n});save();close();render();};
}
function subSheet(id){
  const s=id?db.subs.find(x=>x.id===id):{name:""};
  open(`<div class="tt">${id?"ویرایش زیرمنو":"زیرمنوی جدید"}</div><div class="lbl">نام زیرمنو *</div><input class="inp" id="f_name" value="${esc(s.name)}" placeholder="مثلاً چاقوها"><div class="btnrow"><button class="btn ghost" onclick="close()">انصراف</button><button class="btn main" id="f_ok">ذخیره</button></div>`);
  $("f_ok").onclick=()=>{const n=$("f_name").value.trim();if(!n)return alert("نام زیرمنو را وارد کن.");if(id)db.subs=db.subs.map(x=>x.id===id?{...x,name:n}:x);else db.subs.push({id:uid(),categoryId:nav.categoryId,name:n});save();close();render();};
}
let tmpPhoto=null,tmpReceipt=null;
function fileToImg(file,cb){
  const r=new FileReader();
  r.onload=()=>{const img=new Image();img.onload=()=>{const mx=640;let w=img.width,h=img.height;if(Math.max(w,h)>mx){const k=mx/Math.max(w,h);w=Math.round(w*k);h=Math.round(h*k);}const c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(img,0,0,w,h);cb(c.toDataURL("image/jpeg",.72));};img.src=r.result;};
  r.readAsDataURL(file);
}
function itemSheet(id){
  const it=id?db.items.find(x=>x.id===id):{name:"",photo:null,priority:"normal",status:"not_bought",store:"",price:"",paidAmount:"",payMethod:"cash",receipt:null,note:""};
  tmpPhoto=it.photo||null;tmpReceipt=it.receipt||null;
  open(`<div class="tt">${id?"ویرایش کالا":"کالای جدید"}</div>
  <div class="lbl">نام کالا *</div><input class="inp" id="f_name" value="${esc(it.name)}">
  <div class="lbl">عکس محصول</div><input type="file" id="f_photo" accept="image/*"><div id="pv1">${tmpPhoto?`<img class="big" src="${tmpPhoto}">`:""}</div>
  <div class="lbl">اولویت</div><div class="chips">${Object.entries(P).map(([k,v])=>`<button class="chip${it.priority===k?" on":""}" data-p="${k}">${v[0]}</button>`).join("")}</div>
  <div class="lbl">وضعیت</div><div class="chips">${Object.entries(S).map(([k,v])=>`<button class="chip${it.status===k?" on":""}" data-s="${k}">${v[0]}</button>`).join("")}</div>
  <div class="lbl">فروشگاه</div><input class="inp" id="f_store" value="${esc(it.store||"")}" placeholder="بازار، دیجی‌کالا...">
  <div class="row2"><div><div class="lbl">قیمت کل (تومان)</div><input class="inp" id="f_price" inputmode="numeric" value="${it.price??""}"></div><div><div class="lbl">پرداخت‌شده</div><input class="inp" id="f_paid" inputmode="numeric" value="${it.paidAmount??""}"></div></div>
  <div class="lbl">نحوه خرید</div><div class="chips">${Object.entries(M).map(([k,v])=>`<button class="chip${it.payMethod===k?" on":""}" data-m="${k}">${v}</button>`).join("")}</div>
  <div class="lbl">رسید خرید</div><input type="file" id="f_receipt" accept="image/*"><div id="pv2">${tmpReceipt?`<img class="big" src="${tmpReceipt}">`:""}</div>
  <div class="lbl">یادداشت</div><textarea class="inp" id="f_note">${esc(it.note||"")}</textarea>
  <div class="btnrow"><button class="btn ghost" onclick="close()">انصراف</button><button class="btn main" id="f_ok">ذخیره</button></div>`);
  let pr=it.priority,st=it.status,pm=it.payMethod;
  panel.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{pr=b.dataset.p;panel.querySelectorAll("[data-p]").forEach(x=>x.classList.remove("on"));b.classList.add("on");});
  panel.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{st=b.dataset.s;panel.querySelectorAll("[data-s]").forEach(x=>x.classList.remove("on"));b.classList.add("on");});
  panel.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{pm=b.dataset.m;panel.querySelectorAll("[data-m]").forEach(x=>x.classList.remove("on"));b.classList.add("on");});
  $("f_photo").onchange=e=>{if(e.target.files[0])fileToImg(e.target.files[0],u=>{tmpPhoto=u;$("pv1").innerHTML=`<img class="big" src="${u}">`;});};
  $("f_receipt").onchange=e=>{if(e.target.files[0])fileToImg(e.target.files[0],u=>{tmpReceipt=u;$("pv2").innerHTML=`<img class="big" src="${u}">`;});};
  $("f_ok").onclick=()=>{
    const n=$("f_name").value.trim();if(!n)return alert("نام کالا را وارد کن.");
    const price=parseP($("f_price").value);let paid=$("f_paid").value===""?(st==="bought"?price:0):parseP($("f_paid").value);
    const obj={name:n,photo:tmpPhoto,priority:pr,status:st,store:$("f_store").value.trim(),price,paidAmount:paid,payMethod:pm,receipt:tmpReceipt,note:$("f_note").value};
    if(id)db.items=db.items.map(x=>x.id===id?{...x,...obj}:x);else db.items.push({id:uid(),subId:nav.subId,...obj});
    save();close();render();
  };
}
function itemView(id){
  const it=db.items.find(x=>x.id===id);if(!it)return;
  const p=P[it.priority]||P.normal,s=S[it.status]||S.not_bought;
  open(`<div class="tt">${esc(it.name)}</div>${it.photo?`<img class="big" src="${it.photo}">`:""}
  <div class="srow"><span>فروشگاه</span><b>${esc(it.store||"—")}</b></div>
  <div class="srow"><span>قیمت</span><b>${it.price?fa(it.price)+" تومان":"—"}</b></div>
  <div class="srow"><span>پرداخت‌شده</span><b>${fa(it.paidAmount||0)}</b></div>
  <div class="srow"><span>نحوه خرید</span><b>${M[it.payMethod]||"—"}</b></div>
  <div>${badge(p[0],p[1],p[2])}${badge(s[0],s[1],s[2])}</div>
  ${it.note?`<div class="ss">📝 ${esc(it.note)}</div>`:""}
  ${it.receipt?`<img class="big" src="${it.receipt}">`:'<div class="ss">🧾 رسیدی ثبت نشده</div>'}
  <div class="btnrow"><button class="btn main" onclick="close()">بستن</button></div>`);
}
main.addEventListener("click",e=>{
  const t=e.target;
  const ec=t.closest("[data-edit-cat]"),dc=t.closest("[data-del-cat]");
  const es=t.closest("[data-edit-sub]"),ds=t.closest("[data-del-sub]");
  const ei=t.closest("[data-edit-item]"),di=t.closest("[data-del-item]");
  const f=t.closest("[data-f]"),cat=t.closest("[data-cat]"),sub=t.closest("[data-sub]"),item=t.closest("[data-item]");
  if(ec){e.stopPropagation();catSheet(ec.dataset.editCat);return;}
  if(dc){e.stopPropagation();if(confirm("دسته و همه زیرمنوها و اقلامش حذف شود؟")){const id=dc.dataset.delCat;const sids=db.subs.filter(s=>s.categoryId===id).map(s=>s.id);db={categories:db.categories.filter(c=>c.id!==id),subs:db.subs.filter(s=>s.categoryId!==id),items:db.items.filter(i=>!sids.includes(i.subId))};save();render();}return;}
  if(es){e.stopPropagation();subSheet(es.dataset.editSub);return;}
  if(ds){e.stopPropagation();if(confirm("زیرمنو و اقلامش حذف شود؟")){const id=ds.dataset.delSub;db={...db,subs:db.subs.filter(s=>s.id!==id),items:db.items.filter(i=>i.subId!==id)};save();render();}return;}
  if(ei){e.stopPropagation();itemSheet(ei.dataset.editItem);return;}
  if(di){e.stopPropagation();if(confirm("این کالا حذف شود؟")){db={...db,items:db.items.filter(i=>i.id!==di.dataset.delItem)};save();render();}return;}
  if(f){filter=f.dataset.f;render();return;}
  if(item){const it=db.items.find(x=>x.id===item.dataset.item);
    if(t.classList&&t.classList.contains("badge")){const nx=it.status==="not_bought"?"buying":it.status==="buying"?"bought":"not_bought";it.status=nx;if(nx==="bought")it.paidAmount=+it.price||0;save();render();return;}
    itemView(item.dataset.item);return;}
  if(sub){nav={screen:"items",categoryId:nav.categoryId,subId:sub.dataset.sub};render();return;}
  if(cat){nav={screen:"subs",categoryId:cat.dataset.cat};render();return;}
});
$("backBtn").onclick=()=>{if(nav.screen==="subs")nav={screen:"home"};else if(nav.screen==="items")nav={screen:"subs",categoryId:nav.categoryId};else nav={screen:"home"};render();};
$("finBtn").onclick=()=>{nav={screen:"finance"};render();};
$("search").oninput=render;
$("backupBtn").onclick=()=>{
  open(`<div class="tt">بکاپ</div><div class="hint">فایل JSON همه داده‌هاست. نگهش دار؛ با «ورود بکاپ» می‌تونی برگردونی.</div><div class="btnrow"><button class="btn ghost" id="b_imp">📥 ورود بکاپ</button><button class="btn main" id="b_exp">📤 دانلود بکاپ</button></div><input type="file" id="b_file" accept="application/json" style="display:none"><div class="btnrow"><button class="btn ghost" onclick="close()">بستن</button></div>`);
  $("b_exp").onclick=()=>{const blob=new Blob([JSON.stringify(db)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="jahizyie-backup.json";a.click();};
  $("b_imp").onclick=()=>$("b_file").click();
  $("b_file").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);db={categories:d.categories||[],subs:d.subs||[],items:d.items||[]};save();close();nav={screen:"home"};render();alert("بکاپ برگشت.");}catch{alert("فایل معتبر نیست.");}};r.readAsText(f);};
};
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js");
render();
</script>
</body>
</html>
