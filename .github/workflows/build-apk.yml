name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
      - name: Install deps (mirror-friendly)
        run: |
          npm config set registry https://registry.npmmirror.com
          npm install
          npx expo --version
      - name: Prebuild
        run: npx expo prebuild --platform android --clean
      - name: Verify Kotlin pin
        run: |
          grep -H "android.kotlinVersion" android/gradle.properties
          grep -H "kotlinVersion" android/build.gradle | head -5
          grep -q "android.kotlinVersion=1.9.25" android/gradle.properties || (echo "KOTLIN PIN MISSING - CI is not on the fix commit" && exit 1)
      - name: Build release APK (bundled JS, no Metro needed)
        working-directory: android
        run: ./gradlew assembleRelease
      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: jahizyie-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
